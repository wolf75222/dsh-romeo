# ==============================================================================
# Kimi-K3.1-Pro for DeepSeek Harness: vLLM, 8 nodes (32 GH200), 1M context
# ==============================================================================
# romeollmtool fiche installed by dsh-romeo in ~/.romeollmtool/configs.
# Use it with dsh-romeo --models kimi (or kimi+deepseek).
#
# Kimi-K3.1-Pro (moonshotai/Kimi-K3.1-Pro, rev. 6d0a0202, 2 November 2026):
# Kimi K3 post-trained, with Gated DeepSeek Sparse Attention (DSA, top-2048
# indexer) in place of the 24 full-attention MLA layers. MXFP4 routed experts,
# 1.56 TB, the same size as K3, so the same 32 GPUs: 1.56 TB / 32 = 47 GiB of
# weights per GPU out of 96. Two replicas would need 64 GPUs, above the
# 60-GPU account limit.
#
# Engine: no vLLM release has K3.1 yet (vllm-project/vllm#65685, Docker image
# only). The engine is a personal one (engine_dir:): vLLM 0.33.0 plus the
# Python of that PR on the precompiled kernels of its merge base, built on an
# armgpu node by engines/build-vllm-k31.sbatch. This fiche uses its copy
# vllm-k31-pp: the same engine plus vllm-project/vllm#53948 (deferred receives
# of the sampled tokens between pipeline stages, ported onto it, branch pr53948
# of its src/), which makes async scheduling work with pipeline parallelism.
#
# Weights and engine are on project r260105's storage. Other projects: stage
# them with the same scripts and change every /project/r260105/rmdraux path below
# (weights, engine, caches, TMPDIR).
#
# Starting point: the retained Kimi K3 fiche (October 2026, vLLM 0.32.0), whose
# settings carry over since only the attention of 24 layers changed:
# - TP8 x PP4 (TP8 = 2 nodes over InfiniBand, 4 pipeline stages): 10.3 against
#   6.8 tok/s per agent at 9 agents for TP4 x PP8, TTFT halved at 16K;
# - DCP4 with all-to-all exchanges and a replicated query projection
#   (--dcp-comm-backend a2a --dcp-q-replicate): each request's KV cache is
#   spread over the 4 GPUs of one node (DCP groups are consecutive TP ranks), so
#   the DCP exchanges stay on NVLink. 2026-11-06, two runs against the same
#   day's DCP8: 38.2-38.6 against 34-35 tok/s for one agent, 23.3-23.8 against
#   15.9 at 4 agents, 28.4-29.4 against 12-18 at 9, 14.0-14.2 against 9.5 for 9
#   agents at 128K, 37.3-37.8 against 34.8 at 800K. 10.96M tokens of KV cache
#   instead of 21.1M: still 10 full 1M contexts, enough for the 6-8 agents Kimi
#   serves at once. DCP4 without a2a is 1-3 % slower;
# - async scheduling with #53948 (2026-11-06, two runs against the same day's
#   control): 35 against 30.8 tok/s for one agent, 16.0 against 15.4 at 4,
#   13.6-13.9 against 10.1 at 16, 9.5 against 6.4 for 9 agents at 128K;
#   functional tests unchanged. Without the patch async scheduling collapses
#   from 4 agents (8.9/7.6/7.9 at 4/9/16: one decode every 4 steps), which is
#   why K3 ran with --no-async-scheduling;
# - fastsafetensors: weights in 6 min on cold nodes, against ~30 min;
# - --gpu-memory-utilization 0.78: GH200s sometimes have only 77-80 GiB free
#   at start (host pages on the HBM);
# - Marlin MoE: Hopper has no FP4, Marlin dequantizes the MXFP4 experts.
# The attention backend is left to vLLM: the DSA layers need the sparse MLA one.
# Images: the vision encoder (MoonViT-V2, 401M parameters) is served, no
# --language-model-only, so Kimi reads the screenshots pasted in dsh. Tested on
# ROMEO (2026-11-06): the number in a test image read correctly, 21.1M tokens of
# KV cache and the same speed as text only (30.7 tok/s for one agent, 15.3 for
# 4, 9.4 for 16; 30.6 at 800K tokens).
# Plus what dsh-romeo kept for DeepSeek: 1M context, 256K output, 32 CPUs per
# node, --stream-interval 4, Moonshot's sampling (temperature 1.0, top_p 0.95),
# maximum reasoning by default.
# Measured on ROMEO (2026-11-04, 16K prompts unless said): 30.5 tok/s for one
# agent, 15.4 each for 4, 12.0 for 9, 9.4 for 16 (140 tok/s in all); 30 tok/s
# for one agent at 763K tokens (TTFT 80 s). 21.1M tokens of KV cache: 20 full
# 1M contexts. About 5 % below K3 with the same settings (the DSA indexer).
# Tried and left out:
# - --max-num-batched-tokens 16384: -28 to -39 % per agent at 4 to 16 agents,
#   KV cache 16.6M;
# - DSpark (Inferact/Kimi-K3.1-Pro-DSpark-preview): no Hopper backend runs its
#   non-causal draft MLA under DCP (FlashInfer MLA is SM100 only, FlashMLA
#   refuses DCP); without DCP the KV cache holds 804K tokens, less than one
#   1M context.
# ==============================================================================

id: dsh-kimi-k3.1-pro-1m
display_name: "Kimi-K3.1-Pro for dsh, 8 nodes TP8 x PP4 x DCP4, 1M context"
verified: experimental
verified_note: "tuned for DeepSeek Harness agents (dsh-romeo), from the Kimi K3 measurements"
engine: vllm
license: "Kimi-K3.1 License"
license_usage: open
category: [general, reasoning, tools, long-context, moe]

env:
  NCCL_IB_HCA: "mlx5_0,mlx5_1,mlx5_2,mlx5_3"
  NCCL_SOCKET_IFNAME: "ibp3s0"
  GLOO_SOCKET_IFNAME: "ibp3s0"
  # No NVLink between nodes: plain NCCL over InfiniBand.
  NCCL_MNNVL_ENABLE: "0"
  NCCL_NVLS_ENABLE: "0"
  NCCL_CUMEM_ENABLE: "1"
  VLLM_ALLREDUCE_USE_FLASHINFER: "0"
  VLLM_ALLREDUCE_USE_SYMM_MEM: "0"
  # Avoids a 21-min hang at start on K3 (TRTLLM barrier against a GEMM).
  VLLM_FLASHINFER_ALLREDUCE_BACKEND: "mnnvl"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  # K3.1 has no compiled submodule: without breakable graphs vLLM falls back to
  # FULL_DECODE_ONLY and every mixed step runs eager. +4 to +11 % per agent.
  VLLM_USE_BREAKABLE_CUDAGRAPH: "1"
  VLLM_ENGINE_READY_TIMEOUT_S: "7200"
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "3600"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  RAY_memory_monitor_refresh_ms: "0"
  HF_HUB_OFFLINE: "1"
  # Before the job starts on each node: drop the page cache that earlier jobs left on the GPU memory
  # (both models' files) and our stale NCCL files in /dev/shm (share/prestart/sitecustomize.py).
  PYTHONPATH: "/home/__USER__/.dsh-romeo/prestart"
  DSH_ROMEO_EVICT: "/project/r260105/rmdraux/kimi-k31-pro/models:/gpfs/scratch/romeotools/llmstorage/unsloth/DeepSeek-V4.1-Flash-1017"
  TRANSFORMERS_OFFLINE: "1"
  # Compilation caches on /project: faster later starts.
  HF_HOME: "/project/r260105/rmdraux/kimi-k31-pro/cache/huggingface"
  TRITON_CACHE_DIR: "/project/r260105/rmdraux/kimi-k31-pro/cache/triton"
  TORCHINDUCTOR_CACHE_DIR: "/project/r260105/rmdraux/kimi-k31-pro/cache/inductor"
  VLLM_CACHE_ROOT: "/project/r260105/rmdraux/kimi-k31-pro/cache/vllm"
  CUDA_CACHE_PATH: "/project/r260105/rmdraux/kimi-k31-pro/cache/cuda"
  FLASHINFER_WORKSPACE_BASE: "/project/r260105/rmdraux/kimi-k31-pro/cache"
  # JIT builds off /scratch_p (file quota).
  TMPDIR: "/project/r260105/rmdraux/kimi-k31-pro/tmp"

slurm:
  time: "24:00:00"
  nodes: 8
  gpus: 4
  cpus: 32
  memory: "500G"
  constraint: "armgpu"
  reservation: ""

vllm:
  engine_dir: "/project/r260105/rmdraux/engines/vllm-k31-pp"
  model: "/project/r260105/rmdraux/kimi-k31-pro/models/Kimi-K3.1-Pro-6d0a0202"
  served_model_name: "dsh-kimi-k3.1-pro-1m"
  tensor_parallel_size: 8
  pipeline_parallel_size: 4
  extra_args:
    - "--trust-remote-code"
    - "--disable-custom-all-reduce"
    - "--load-format"
    - "fastsafetensors"
    - "--dtype"
    - "bfloat16"
    - "--mamba-ssm-cache-dtype"
    - "float32"
    - "--decode-context-parallel-size"
    - "4"
    - "--dcp-comm-backend"
    - "a2a"
    - "--dcp-q-replicate"
    - "--moe-backend"
    - "marlin"
    - "--gpu-memory-utilization"
    - "0.78"
    - "--max-model-len"
    - "1048576"
    - "--max-num-seqs"
    - "16"
    - "--max-num-batched-tokens"
    - "8192"
    - "--async-scheduling"
    - "--enable-chunked-prefill"
    - "--enable-prefix-caching"
    - "--prefix-match-unit"
    - "128"
    - "--enable-prompt-tokens-details"
    - "--enable-auto-tool-choice"
    - "--tool-call-parser"
    - "kimi_k3"
    - "--reasoning-parser"
    - "kimi_k3"
    - "--stream-interval"
    - "4"

generation:
  temperature: 1.0
  top_p: 0.95
  max_tokens: 262144
