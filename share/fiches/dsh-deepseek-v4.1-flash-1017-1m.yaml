# ==============================================================================
# DeepSeek-V4.1-Flash-1017 for DeepSeek Harness: vLLM, 2 nodes (8 GH200), 1M context
# ==============================================================================
# romeollmtool fiche installed by dsh-romeo in ~/.romeollmtool/configs.
#
# DeepSeek-V4.1-Flash-1017 (17 October 2026), the update of V4.1-Flash: same
# architecture and config.json, new weights. Read from ROMEO's shared storage
# (the unsloth copy of the original FP8/FP4 weights; deepseek-ai/ only has the
# September V4.1-Flash). vLLM renders the prompts with its own deepseek_v41
# encoder, so the chat_template.jinja that unsloth added is not used.
#
# The catalog fiche deepseek-v4.1-flash-vllm (1 node, 262K context), on vLLM
# 0.33 and tuned for coding agents:
# - tensor parallelism over 8 GPUs on 2 nodes, no pipeline parallelism (the
#   pipeline variants of V4.1 on vLLM 0.31 corrupt long agent contexts);
# - the full 1,048,576-token context and 256K tokens of output;
# - DSpark speculative decoding, 2 draft tokens (the 1017 weights accept a bit
#   less than September's: k=2 beats k=3 by 3-9 %, k=4 loses up to 21 %);
# - 32 CPUs per node and --stream-interval 4 for many agents at once.
# Measured on ROMEO with the September weights (October 2026): about 530 agents
# at once at 30 tokens/s each on 7 replicas (one job = one replica).
#
# gpu-memory-utilization 0.88 (83.6 GiB): 9.09M tokens of KV cache instead of
# 6.19M at 0.82, same speed (A/B on ROMEO, 2026-11-06). Of 531 vLLM starts on
# armgpu nodes none had less than 80 GiB free and 33 had 80-86 GiB, all from 16
# to 19 October; since then 93 GiB are free. 0.90 gives 10.06M but needs 85.5
# GiB free.
# FlashInfer compiles its kernels into FLASHINFER_WORKSPACE_BASE: on each node's
# /tmp, since a ~/.cache/flashinfer shared with another vLLM engine (Kimi's)
# crashed a start with an undefined symbol.
# Tried on ROMEO (2026-10-28) and left out: DP2 x TP4 + expert parallelism
# (+28 % on independent requests, but -23 % on multi-turn agent sessions: each
# DP rank has its own prefix cache), --max-num-batched-tokens 16K/32K (+3 %,
# but half the KV cache), vLLM 0.32.0 (its humming kernels fail to compile on
# SM90).
# vLLM 0.33.0 (2026-11-06, same settings, measured against 0.31 at the same
# time, 16K prompts): +19 % per agent alone, +22 % at 16 agents, +34 % at 64
# (2249 against 1505 tok/s in all), half the time to first token at 64, 6.66M
# tokens of KV cache instead of 6.21M; same functional tests. Its Humming MoE
# kernels compile at the first start into HUMMING_CACHE_DIR: on each node's own
# /tmp, since 8 workers on 2 nodes compiling into one GPFS home directory
# crashed or hung. dsh-romeo puts your ROMEO login in the paths below when it
# installs the fiche (romeollmtool expands no variable).
# DSpark draws its draft tokens from the draft's distribution
# (draft_sample_method probabilistic, not greedy): at temperature 1.0 more of
# them are accepted, and the exact rejection test keeps the output distribution
# unchanged. Measured twice against greedy on 0.33 (2026-11-06, same time):
# +26/+36 % per agent at 4 agents, +15/+19 % at 16, +12/+19 % at 64, +15/+16 %
# in all; 6.42M tokens of KV cache instead of 6.67M.
# Left out from the same night: adaptive verification (DSpark's official
# recipe, also k=3 or k=5 alone) needs 16 GiB more per GPU and halves the KV
# cache; block verification at k=5 loses from 16 agents on.
# Images: the vision encoder is served (no --language-model-only), tested on
# ROMEO (2026-11-05): an image read correctly in 0.9 s, 6.34M tokens of KV
# cache instead of 6.5M, 160 tok/s for one agent with DSpark.
# DeepSeek's sampling: temperature 1.0, top_p 0.95.
# ==============================================================================

id: dsh-deepseek-v4.1-flash-1017-1m
display_name: "DeepSeek-V4.1-Flash-1017 for dsh, 2 nodes TP8 + DSpark k=2 (probabilistic draft), 1M context"
verified: experimental
verified_note: "tuned for DeepSeek Harness agents (dsh-romeo)"
engine: vllm
license: "MIT"
license_usage: open
category: [general, reasoning, tools, long-context, moe]

env:
  NCCL_IB_HCA: "mlx5_0,mlx5_1,mlx5_2,mlx5_3"
  NCCL_SOCKET_IFNAME: "ibp3s0"
  GLOO_SOCKET_IFNAME: "ibp3s0"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
  RAY_memory_monitor_refresh_ms: "0"
  # TP8 across 2 nodes: no NVLink between nodes, plain NCCL over InfiniBand.
  NCCL_MNNVL_ENABLE: "0"
  NCCL_NVLS_ENABLE: "0"
  VLLM_ALLREDUCE_USE_FLASHINFER: "0"
  VLLM_ALLREDUCE_USE_SYMM_MEM: "0"
  # Node-local, one directory per user (see above).
  HUMMING_CACHE_DIR: "/tmp/humming-__USER__/cache"
  HUMMING_TMP_DIR: "/tmp/humming-__USER__/tmp"
  FLASHINFER_WORKSPACE_BASE: "/tmp/flashinfer-__USER__"

slurm:
  time: "24:00:00"
  nodes: 2
  gpus: 4
  cpus: 32
  memory: "750G"
  constraint: "armgpu"
  reservation: ""

vllm:
  version: "0.33.0"
  model: "/gpfs/scratch/romeotools/llmstorage/unsloth/DeepSeek-V4.1-Flash-1017"
  served_model_name: "dsh-deepseek-v4.1-flash-1017-1m"
  tensor_parallel_size: 8
  pipeline_parallel_size: 1
  extra_args:
    - "--disable-custom-all-reduce"
    - "--gpu-memory-utilization"
    - "0.88"
    - "--max-model-len"
    - "1048576"
    - "--enable-auto-tool-choice"
    - "--tool-call-parser"
    - "deepseek_v41"
    - "--reasoning-parser"
    - "deepseek_v41"
    - "--stream-interval"
    - "4"
    - "--speculative-config"
    - '{"method":"dspark","num_speculative_tokens":2,"draft_sample_method":"probabilistic"}'

generation:
  temperature: 1.0
  top_p: 0.95
  max_tokens: 262144
