name: Offline tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Runtime and installer regressions (no ROMEO)
        run: bash tests/run.sh && bash tests/install.sh
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Windows PowerShell 5.1
        shell: powershell
        run: ./tests/windows.ps1
      - name: PowerShell 7
        shell: pwsh
        run: ./tests/windows.ps1
